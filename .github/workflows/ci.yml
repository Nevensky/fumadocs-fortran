name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly, so that the pinned corpora and the oldest Node keep being exercised
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the oldest Node the package supports (engines), up to the current LTS
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # the package has no dependencies; React is installed only so that the components' rendering checks run
      - run: npm install --no-save --no-package-lock react@19 react-dom@19
      - run: npm test
      # the committed HPC registry: counts, size, known entries, links, sources and notices (no network)
      - run: npm run test:registry

  shiki:
    name: Shiki grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # the grammar pack's development tools, at the versions it was built and tested with (tm-grammars as pinned in
      # scripts/build-grammars.mjs); installed without saving them, as the package keeps no devDependencies
      - run: npm install --no-save --no-package-lock shiki@4.6.0 tm-grammars@1.32.22 fumadocs-core@16.19.5
      # that shiki/ is what scripts/build-grammars.mjs writes, scope snapshots on both regex engines, load orders in
      # Shiki and through fumadocs' rehypeCode, the transformers, and what the directives and fypp add to tokenising
      # time (at most 25%)
      - run: npm run test:shiki

  gate:
    name: Parser gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch the pinned public corpora
        run: scripts/fetch-corpus.sh
      - name: Check the parser against them (gcc's cpp is the oracle for preprocessing)
        run: node scripts/gate.mjs

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Lint the package (exports, files, types)
        run: npx --yes publint@0.3 --strict
      - name: Check the type declarations
        run: |
          npm install --no-save --no-package-lock typescript@5 @types/node@24 @types/react@19
          npx tsc --noEmit --strict --target es2022 --lib es2022,dom --module nodenext --moduleResolution nodenext \
            --types node types/index.d.ts types/math.d.ts types/react.d.ts types/shiki.d.ts
      - name: List what would be published
        run: npm pack --dry-run
      - name: Install the packed package in a new project and use it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cp test/fixtures/modern/modern_ford.F90 "$RUNNER_TEMP/consumer/" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null && npm pkg set type=module
          npm install "$RUNNER_TEMP"/fumadocs-fortran-*.tgz
          npx fumadocs-fortran dump --summary -DUSE_MPI modern_ford.F90
          node --input-type=module -e "
            const { extract, parseSource } = await import('fumadocs-fortran');
            const ir = await extract({ sources: ['modern_ford.F90'], cpp: { macros: { USE_MPI: 1 } } });
            const one = parseSource('subroutine s(n)\n integer, intent(in) :: n\nend subroutine\n');
            const args = Object.values(ir.entities).reduce((n, e) => n + (e.args?.length ?? 0), 0);
            if (args !== 41 || one.entities['procedure:s'].args[0].intent !== 'in') process.exit(1);
            console.log('the packed package installs, imports and parses');
          "
          node --input-type=module -e "
            const { lookup } = await import('./node_modules/fumadocs-fortran/registry/read.mjs');
            if (lookup('lapack', 'dgesv')?.family?.id !== 'gesv' || !lookup('mpi', 'MPI_Allreduce')?.links.openmpi) process.exit(1);
            console.log('the packed HPC registry loads');
          "
          node --input-type=module -e "
            const { fortranLanguages, fortranRehypeCode } = await import('fumadocs-fortran/shiki');
            const { createRequire } = await import('node:module');
            const free = createRequire(process.cwd() + '/')('fumadocs-fortran/shiki/fortran.json');
            const names = fortranLanguages.map((lang) => lang.name).join(' ');
            if (names !== 'fortran fortran-fixed fortran-directives fortran-fypp') process.exit(1);
            if (typeof fortranRehypeCode !== 'function' || free.scopeName !== 'source.fortran.free.fd') process.exit(1);
            console.log('the packed grammar pack loads');
          "

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Check that the generated showcase pages are up to date
        run: |
          node docs/scripts/gen-showcase.mjs
          git diff --exit-code -- docs/content/docs/showcase
      - run: npm ci
        working-directory: docs
      - name: Build the static site
        run: npm run build
        working-directory: docs
        env:
          DOCS_EXPORT: '1'
